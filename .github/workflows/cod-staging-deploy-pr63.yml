name: COD Staging Deploy PR63

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_PR63_COD_STAGING to authorize the exact-SHA deploy on permanent COD Staging.'
        type: string
        default: ""
        required: true

permissions:
  contents: read

concurrency:
  group: cod-staging-deploy-pr63
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PR63 and smoke-test notification setup on permanent COD Staging
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY_PR63_COD_STAGING'
    runs-on: ubuntu-latest
    environment: render-production
    timeout-minutes: 45

    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy exact PR63 SHA and verify Staging
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dc2ao2e8bjmc73f5cjig
          APP_URL: https://nokmel-cod-staging.onrender.com
          CANDIDATE_SHA: 6fdb8f4dc897909e2bb8ffb09a9b73b9a9ed4da4
          DEPLOY_CONFIRM: DEPLOY_PR63_COD_STAGING
        run: node scripts/cod-staging-deploy-pr63.mjs

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-staging-pr63-deploy-summary
          path: /tmp/cod-staging-pr63-summary.json
          if-no-files-found: ignore
          retention-days: 7
