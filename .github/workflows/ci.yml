name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runs on every push to main and on pull requests targeting main.
# No secrets are required: the app has no database, auth or API integrations yet.
jobs:
  verify:
    name: Install, lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
