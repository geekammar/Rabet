name: COD Staging Deploy PR62

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_PR62_COD_STAGING to authorize the exact-SHA deploy and Vodafone QA fixture on permanent COD Staging.'
        type: string
        default: ""
        required: true
  push:
    branches:
      - ops/vodafone-staging-pr62-deploy

permissions:
  contents: read

concurrency:
  group: cod-staging-deploy-pr62
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PR62 and prepare Vodafone QA on permanent COD Staging
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-cod-staging-pr62]')
    runs-on: ubuntu-latest
    environment: render-production
    timeout-minutes: 45

    steps:
      - name: Validate confirmation
        env:
          RABET_CONFIRM: ${{ inputs.confirm }}
          RABET_REF: ${{ github.ref }}
          RABET_EVENT: ${{ github.event_name }}
        run: |
          if [ "${RABET_EVENT}" = "workflow_dispatch" ]; then
            if [ "${RABET_CONFIRM}" != "DEPLOY_PR62_COD_STAGING" ]; then
              echo "Confirmation must equal DEPLOY_PR62_COD_STAGING." >&2
              exit 1
            fi
          else
            if [ "${RABET_REF}" != "refs/heads/ops/vodafone-staging-pr62-deploy" ]; then
              echo "Push trigger is restricted to ops/vodafone-staging-pr62-deploy." >&2
              exit 1
            fi
          fi

      - name: Checkout orchestration branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy reviewed PR62 SHA, verify Staging and prepare Vodafone QA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dc2ao2e8bjmc73f5cjig
          APP_URL: https://nokmel-cod-staging.onrender.com
          CANDIDATE_SHA: 3aec0f13e29a2ef5ca032987f5dfea5d99ec94cc
          DEPLOY_CONFIRM: DEPLOY_PR62_COD_STAGING
        run: node scripts/cod-staging-deploy-pr62.mjs

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-staging-pr62-summary
          path: /tmp/cod-staging-pr62-summary.json
          if-no-files-found: ignore
          retention-days: 7
