name: PR48 Staging Database

on:
  push:
    branches:
      - chore/pr48-staging-gate-a
  workflow_dispatch:
    inputs:
      action:
        description: "Staging database operation."
        type: choice
        options:
          - all
          - provision
          - migrate
          - seed
          - verify
          - reset-all
        default: all
        required: true
      candidate_sha:
        description: "Exact reviewed PR #48 head (40-character SHA)."
        type: string
        default: "e484a2ec59cbc39d58265f3be485821779c8713a"
        required: true
      confirm:
        description: 'Type PROVISION_STAGING_DB to authorize provisioning, migration, or seeding.'
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: pr48-staging-db
  cancel-in-progress: false

jobs:
  staging-db:
    name: Staging database operation
    runs-on: ubuntu-latest
    environment: staging-pr48
    timeout-minutes: 30

    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create the reviewed candidate worktree
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rabet-candidate "${{ inputs.candidate_sha || 'e484a2ec59cbc39d58265f3be485821779c8713a' }}"
          test "$(git -C /tmp/rabet-candidate rev-parse HEAD)" = "${{ inputs.candidate_sha || 'e484a2ec59cbc39d58265f3be485821779c8713a' }}"

      - name: Install orchestration dependencies
        run: npm ci

      - name: Install candidate dependencies
        working-directory: /tmp/rabet-candidate
        run: npm ci

      - name: Run the staging database operation
        env:
          NEON_DEV_DATABASE_URL: ${{ secrets.NEON_DEV_DATABASE_URL }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          SEED_ARTIFACT_PASSPHRASE: ${{ secrets.SEED_ARTIFACT_PASSPHRASE }}
          RABET_STAGING_MODE: ${{ inputs.action || (contains(github.event.head_commit.message, '[reset]') && 'reset-all' || 'all') }}
          RABET_CANDIDATE_SHA: ${{ inputs.candidate_sha || 'e484a2ec59cbc39d58265f3be485821779c8713a' }}
          RABET_CODE_ROOT: /tmp/rabet-candidate
          RABET_CONFIRM: ${{ inputs.confirm || 'PROVISION_STAGING_DB' }}
        run: node scripts/staging-pr48-db.mjs

      - name: Encrypt temporary credential bundles
        if: always()
        env:
          SEED_ARTIFACT_PASSPHRASE: ${{ secrets.SEED_ARTIFACT_PASSPHRASE }}
        run: |
          set -euo pipefail
          found=0
          for file in /tmp/pr48-staging-bundle.json /tmp/pr48-merchant-fixture.json; do
            if [ -f "$file" ]; then
              openssl enc -aes-256-cbc -pbkdf2 -salt -in "$file" -out "$file.enc" -pass env:SEED_ARTIFACT_PASSPHRASE
              rm -f "$file"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No new credential bundle was produced."
          fi

      - name: Upload encrypted credential bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr48-staging-secrets
          path: /tmp/*.enc
          if-no-files-found: warn
          retention-days: 1

      - name: Upload sanitized summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr48-staging-summary
          path: /tmp/pr48-*-summary.json
          if-no-files-found: ignore
          retention-days: 7
