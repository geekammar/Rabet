name: Render Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character commit SHA on current origin/main to verify and publish."
        type: string
        required: true
      confirm:
        description: "Type PUBLISH_RENDER_IMAGE exactly to authorize GHCR publication."
        type: string
        required: true
      deploy_to_render:
        description: "After publishing, deploy the verified digest to Render and verify Live + /api/healthz. Requires the render-production environment."
        type: boolean
        default: false

# Least-privilege default across all jobs. Only `publish` receives
# `packages: write`; only `deploy-render` receives the Render environment
# secret. Automatic release/deploy is OFF unless the owner sets the repository
# variable RABET_AUTO_DEPLOY_ENABLED=true after Checkpoint B review.
permissions:
  contents: read

# Serialize all release-path runs (push main, manual dispatch on main). PR
# verification stays isolated per PR. Queued release runs re-check origin/main
# before every irreversible step and stop if they are stale.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('render-image-pr-{0}', github.event.pull_request.number) || 'render-image-release-main' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Fast release-gate fixture tests. These are the same tests CI runs through
  # `npm run test`; keeping this job in the image workflow makes the
  # workflow-level gate evidence visible directly beside the build/smoke job.
  # ---------------------------------------------------------------------------
  release-gate-tests:
    name: Release gate fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run GHCR and Render release-gate fixtures
        run: npx vitest run tests/ghcr-release-gate.test.ts tests/render-deploy-gate.test.ts

  # ---------------------------------------------------------------------------
  # Automatic PR and main verification — builds and smoke-tests the linux/amd64
  # runtime image with isolated PostgreSQL, synthetic credentials, dummy
  # webhook configuration, and zero package-publish permissions or prod secrets.
  # ---------------------------------------------------------------------------
  verify-image:
    name: Build & smoke-test runtime image (linux/amd64)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rabet
          POSTGRES_PASSWORD: rabet
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rabet -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm no hosted production credentials are present
        run: |
          node - <<'NODE'
            const keys = Object.keys(process.env)
              .filter((k) => /^(NEON|VERCEL|RENDER)_/i.test(k));
            if (keys.length > 0) {
              console.error(`Refusing to run with hosted credentials configured: ${keys.join(", ")}`);
              process.exit(1);
            }
            if (/neon\.tech/i.test(process.env.DATABASE_URL ?? "")) {
              console.error("Refusing to run: DATABASE_URL points at neon.tech.");
              process.exit(1);
            }
            console.log("Verified: zero Neon, Vercel, or Render credentials present.");
          NODE

      - name: Install host test runner dependencies
        run: npm ci

      - name: Wait for isolated PostgreSQL service
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U rabet -d postgres -t 2 >/dev/null 2>&1; then
              echo "PostgreSQL service is ready."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL service did not become ready." >&2
          exit 1

      - name: Build linux/amd64 runtime image
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          IMAGE_TAG="rabet-smoke:${BUILD_SHA}"
          docker build \
            --platform linux/amd64 \
            --build-arg GIT_SHA="${BUILD_SHA}" \
            --tag "${IMAGE_TAG}" \
            .
          echo "SMOKE_IMAGE=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Run container acceptance smoke suite
        env:
          RABET_SMOKE_IMAGE: ${{ env.SMOKE_IMAGE }}
          RABET_EXPECTED_SHA: ${{ github.sha }}
          RABET_TEST_PG_URL: postgresql://rabet:rabet@localhost:5432/postgres
        run: node scripts/test-container-smoke.mjs

      - name: Write verification summary
        run: |
          {
            echo "## Render Runtime Image Verification"
            echo ""
            echo "- **Event:** \`${{ github.event_name }}\`"
            echo "- **Verified Commit SHA:** \`${{ github.sha }}\`"
            echo "- **Target Platform:** \`linux/amd64\` (\`node:22-bookworm-slim\`)"
            echo "- **Published to Registry:** No (verification only; \`packages: write\` not granted)"
            echo "- **Checks Passed:** non-root runtime, non-default \`PORT\`, \`GET /api/healthz\` 200 + SHA, public \`/\` + compiled CSS, PWA manifest + icons, signed-out redirects, Argon2id valid/invalid login, HTTPS reverse-proxy \`AUTH_URL\` redirects + \`__Secure-\` cookie, isolated PostgreSQL dashboard read + \`private, no-store, must-revalidate\`, and dummy webhook 503/401 rejection with zero DB writes and zero Telegram calls."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Manual or owner-activated automatic main-only release gate + verified image
  # build (NO packages:write). Serializes release runs, stops stale releases if
  # origin/main has moved, and requires BOTH a completed successful `push` CI
  # run AND a completed successful `Dependency Audit` run on `main` for the
  # exact expected SHA. Automatic mode additionally requires
  # RABET_AUTO_DEPLOY_ENABLED=true.
  # ---------------------------------------------------------------------------
  prepare-release:
    name: Verify main provenance, CI + Audit status & smoke-test release image
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RABET_AUTO_DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: render-image-release
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      verified_sha: ${{ steps.provenance.outputs.verified_sha }}
      repo_path: ${{ steps.provenance.outputs.repo_path }}
      tag_name: ${{ steps.provenance.outputs.tag_name }}
      image_repo: ${{ steps.provenance.outputs.image_repo }}
      image_tag: ${{ steps.provenance.outputs.image_tag }}
      ci_run_url: ${{ steps.workflow-gates.outputs.ci_run_url }}
      audit_run_url: ${{ steps.workflow-gates.outputs.audit_run_url }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rabet
          POSTGRES_PASSWORD: rabet
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rabet -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Resolve and validate release target
        id: target
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          AUTO_RELEASE_ENABLED: ${{ vars.RABET_AUTO_DEPLOY_ENABLED }}
        run: |
          node - <<'NODE'
            const fs = require("node:fs");
            const eventName = process.env.RELEASE_EVENT ?? "";
            const ref = process.env.RELEASE_REF ?? "";
            const workflowSha = (process.env.WORKFLOW_SHA ?? "").toLowerCase();
            const inputSha = (process.env.INPUT_EXPECTED_SHA ?? "").trim().toLowerCase();
            const confirm = process.env.INPUT_CONFIRM ?? "";
            const autoRelease = process.env.AUTO_RELEASE_ENABLED ?? "";

            if (ref !== "refs/heads/main") {
              console.error(`Refusing to release: ref "${ref}" is not refs/heads/main.`);
              process.exit(1);
            }

            let expectedSha;
            if (eventName === "push") {
              if (autoRelease !== "true") {
                console.error("Refusing automatic release: RABET_AUTO_DEPLOY_ENABLED is not true.");
                process.exit(1);
              }
              expectedSha = workflowSha;
              console.log("Automatic release authorized for current main push SHA.");
            } else if (eventName === "workflow_dispatch") {
              if (confirm !== "PUBLISH_RENDER_IMAGE") {
                console.error('Refusing to publish: confirm input must equal "PUBLISH_RENDER_IMAGE" exactly.');
                process.exit(1);
              }
              if (!/^[0-9a-f]{40}$/.test(inputSha)) {
                console.error(`Refusing to publish: expected_sha "${inputSha}" must be a full 40-char git SHA.`);
                process.exit(1);
              }
              if (workflowSha !== inputSha) {
                console.error(
                  `Refusing to publish stale or mismatched dispatch: workflow SHA (${workflowSha}) !== expected_sha (${inputSha}).`,
                );
                process.exit(1);
              }
              expectedSha = inputSha;
              console.log("Manual dispatch context valid for main.");
            } else {
              console.error(`Refusing to release: unsupported event "${eventName}".`);
              process.exit(1);
            }

            if (!/^[0-9a-f]{40}$/.test(expectedSha)) {
              console.error(`Refusing to release: resolved SHA "${expectedSha}" must be a full 40-char git SHA.`);
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_sha=${expectedSha}\n`);
            console.log(`Release target resolved to main SHA ${expectedSha}.`);
          NODE

      - name: Checkout exact resolved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          fetch-depth: 1

      - name: Verify exact checkout SHA matches current remote origin/main
        id: provenance
        env:
          INPUT_EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          EXPECTED_SHA="$(printf '%s' "${INPUT_EXPECTED_SHA}" | tr '[:upper:]' '[:lower:]' | xargs)"
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"

          if [ "${CHECKOUT_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD (${CHECKOUT_SHA}) does not match expected_sha (${EXPECTED_SHA})."
            exit 1
          fi

          if [ "${REMOTE_MAIN_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Stopping stale release: expected_sha (${EXPECTED_SHA}) is no longer current origin/main (${REMOTE_MAIN_SHA})."
            exit 1
          fi

          REPO_PATH="$(printf '%s' "${REPO_FULL_NAME}" | tr '[:upper:]' '[:lower:]')"
          TAG_NAME="sha-${EXPECTED_SHA}"
          IMAGE_REPO="ghcr.io/${REPO_PATH}"
          IMAGE_TAG="${IMAGE_REPO}:${TAG_NAME}"

          {
            echo "verified_sha=${EXPECTED_SHA}"
            echo "repo_path=${REPO_PATH}"
            echo "tag_name=${TAG_NAME}"
            echo "image_repo=${IMAGE_REPO}"
            echo "image_tag=${IMAGE_TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Verified checkout HEAD and current origin/main == ${EXPECTED_SHA}"
          echo "Target image tag: ${IMAGE_TAG}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wait for exact-SHA main push CI and Dependency Audit success
        id: workflow-gates
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ steps.provenance.outputs.verified_sha }}
          REPO_FULL_NAME: ${{ github.repository }}
          GATE_TIMEOUT_MS: "2400000"
          GATE_POLL_INTERVAL_MS: "20000"
        run: |
          GATE_RESULT="$(node scripts/ghcr-release-gate.mjs wait-workflows)"

          CI_URL="$(GATE_RESULT="${GATE_RESULT}" node -e 'process.stdout.write(JSON.parse(process.env.GATE_RESULT).ciRunUrl)')"
          AUDIT_URL="$(GATE_RESULT="${GATE_RESULT}" node -e 'process.stdout.write(JSON.parse(process.env.GATE_RESULT).auditRunUrl)')"

          {
            echo "ci_run_url=${CI_URL}"
            echo "audit_run_url=${AUDIT_URL}"
          } >> "$GITHUB_OUTPUT"

          echo "Verified successful main push CI run: ${CI_URL}"
          echo "Verified successful main Dependency Audit run: ${AUDIT_URL}"

      - name: Re-verify origin/main did not move while waiting for gates
        env:
          VERIFIED_SHA: ${{ steps.provenance.outputs.verified_sha }}
        run: |
          REMOTE_MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ "${REMOTE_MAIN_SHA}" != "${VERIFIED_SHA}" ]; then
            echo "::error::Stopping stale release after workflow gates: ${VERIFIED_SHA} is no longer current origin/main (${REMOTE_MAIN_SHA})."
            exit 1
          fi
          echo "Confirmed ${VERIFIED_SHA} remains current origin/main after CI and Audit passed."

      - name: Install host test runner dependencies
        run: npm ci

      - name: Wait for isolated PostgreSQL service
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U rabet -d postgres -t 2 >/dev/null 2>&1; then
              echo "PostgreSQL service is ready."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL service did not become ready." >&2
          exit 1

      - name: Build SHA-tagged linux/amd64 release image
        env:
          IMAGE_TAG: ${{ steps.provenance.outputs.image_tag }}
          VERIFIED_SHA: ${{ steps.provenance.outputs.verified_sha }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg GIT_SHA="${VERIFIED_SHA}" \
            --label "org.opencontainers.image.source=${REPO_URL}" \
            --label "org.opencontainers.image.revision=${VERIFIED_SHA}" \
            --tag "${IMAGE_TAG}" \
            .

      - name: Smoke-test exact release image before publication
        env:
          RABET_SMOKE_IMAGE: ${{ steps.provenance.outputs.image_tag }}
          RABET_EXPECTED_SHA: ${{ steps.provenance.outputs.verified_sha }}
          RABET_TEST_PG_URL: postgresql://rabet:rabet@localhost:5432/postgres
        run: node scripts/test-container-smoke.mjs

      - name: Save verified release image archive
        env:
          IMAGE_TAG: ${{ steps.provenance.outputs.image_tag }}
        run: docker save "${IMAGE_TAG}" -o "${RUNNER_TEMP}/rabet-verified-image.tar"

      - name: Upload verified image archive for publish job
        uses: actions/upload-artifact@v4
        with:
          name: rabet-verified-image-${{ steps.provenance.outputs.verified_sha }}
          path: ${{ runner.temp }}/rabet-verified-image.tar
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Main-only GHCR publication — the ONLY job granted `packages: write`.
  # Re-verifies origin/main freshness immediately prior to registry access.
  # Retry-safe: inspects GHCR via OCI v2 API first — if `sha-<SHA>` already
  # exists, verifies provenance (`linux/amd64`, OCI revision & source labels,
  # `RABET_BUILD_SHA`, SHA-256 digests) and reuses its immutable digest without
  # overwriting the tag; stops clearly on provenance mismatch or registry
  # auth/network failure. Preserves all older digests for rollback.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish verified SHA image to GHCR
    needs: prepare-release
    if: |
      needs.prepare-release.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RABET_AUTO_DEPLOY_ENABLED == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: render-image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      final_digest: ${{ steps.release-summary.outputs.final_digest }}
      publish_mode: ${{ steps.release-summary.outputs.publish_mode }}

    steps:
      - name: Checkout release gate helper at exact verified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.verified_sha }}
          fetch-depth: 1
          sparse-checkout: |
            scripts

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-verify target SHA is still current remote main
        env:
          VERIFIED_SHA: ${{ needs.prepare-release.outputs.verified_sha }}
        run: |
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ "${CHECKOUT_SHA}" != "${VERIFIED_SHA}" ]; then
            echo "::error::Checkout HEAD (${CHECKOUT_SHA}) !== verified SHA (${VERIFIED_SHA})."
            exit 1
          fi
          if [ "${REMOTE_MAIN_SHA}" != "${VERIFIED_SHA}" ]; then
            echo "::error::Stopping stale release before GHCR push: ${VERIFIED_SHA} is behind current origin/main (${REMOTE_MAIN_SHA})."
            exit 1
          fi
          echo "Confirmed ${VERIFIED_SHA} remains current origin/main."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether immutable SHA tag already exists on GHCR
        id: tag-check
        env:
          GHCR_REPO_PATH: ${{ needs.prepare-release.outputs.repo_path }}
          GHCR_TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          VERIFIED_SHA: ${{ needs.prepare-release.outputs.verified_sha }}
          EXPECTED_SOURCE_URL: https://github.com/${{ github.repository }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECK_JSON="$(node scripts/ghcr-release-gate.mjs check-ghcr-tag)"
          TAG_STATUS="$(CHECK_JSON="${CHECK_JSON}" node -e 'process.stdout.write(JSON.parse(process.env.CHECK_JSON).status)')"
          echo "tag_status=${TAG_STATUS}" >> "$GITHUB_OUTPUT"

          if [ "${TAG_STATUS}" = "exists_verified" ]; then
            EXISTING_DIGEST="$(CHECK_JSON="${CHECK_JSON}" node -e 'process.stdout.write(JSON.parse(process.env.CHECK_JSON).repoDigest)')"
            echo "existing_repo_digest=${EXISTING_DIGEST}" >> "$GITHUB_OUTPUT"
            echo "Verified existing immutable tag on GHCR (will reuse without overwriting): ${EXISTING_DIGEST}"
          elif [ "${TAG_STATUS}" = "missing" ]; then
            echo "Confirmed tag does not yet exist on GHCR (safe to push once)."
          else
            echo "::error::Unexpected tag check status: ${TAG_STATUS}"
            exit 1
          fi

      - name: Download verified image archive (new tag only)
        if: steps.tag-check.outputs.tag_status == 'missing'
        uses: actions/download-artifact@v4
        with:
          name: rabet-verified-image-${{ needs.prepare-release.outputs.verified_sha }}
          path: ${{ runner.temp }}

      - name: Push new immutable SHA-tagged image (never overwrites existing tags)
        id: push-new
        if: steps.tag-check.outputs.tag_status == 'missing'
        env:
          IMAGE_REPO: ${{ needs.prepare-release.outputs.image_repo }}
          IMAGE_TAG: ${{ needs.prepare-release.outputs.image_tag }}
          VERIFIED_SHA: ${{ needs.prepare-release.outputs.verified_sha }}
        run: |
          docker load -i "${RUNNER_TEMP}/rabet-verified-image.tar"
          LABEL_SHA="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "${IMAGE_TAG}")"
          if [ "${LABEL_SHA}" != "${VERIFIED_SHA}" ]; then
            echo "::error::Loaded image revision label (${LABEL_SHA}) !== verified SHA (${VERIFIED_SHA})."
            exit 1
          fi

          docker push "${IMAGE_TAG}"

          REPO_DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "${IMAGE_TAG}")"
          if ! printf '%s' "${REPO_DIGEST}" | grep -Eq "^${IMAGE_REPO}@sha256:[0-9a-f]{64}$"; then
            echo "::error::Unexpected repo digest format: ${REPO_DIGEST}"
            exit 1
          fi
          echo "repo_digest=${REPO_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify GHCR digest and emit release summary
        id: release-summary
        env:
          TAG_STATUS: ${{ steps.tag-check.outputs.tag_status }}
          EXISTING_DIGEST: ${{ steps.tag-check.outputs.existing_repo_digest }}
          PUSHED_DIGEST: ${{ steps.push-new.outputs.repo_digest }}
          IMAGE_REPO: ${{ needs.prepare-release.outputs.image_repo }}
          IMAGE_TAG: ${{ needs.prepare-release.outputs.image_tag }}
          VERIFIED_SHA: ${{ needs.prepare-release.outputs.verified_sha }}
          CI_RUN_URL: ${{ needs.prepare-release.outputs.ci_run_url }}
          AUDIT_RUN_URL: ${{ needs.prepare-release.outputs.audit_run_url }}
        run: |
          if [ "${TAG_STATUS}" = "exists_verified" ]; then
            FINAL_DIGEST="${EXISTING_DIGEST}"
            PUBLISH_MODE="Reused existing provenance-verified digest (retry-safe; tag was not overwritten)"
          else
            FINAL_DIGEST="${PUSHED_DIGEST}"
            PUBLISH_MODE="Published new immutable SHA-tagged image"
          fi

          if ! printf '%s' "${FINAL_DIGEST}" | grep -Eq "^${IMAGE_REPO}@sha256:[0-9a-f]{64}$"; then
            echo "::error::Invalid final GHCR digest reference: ${FINAL_DIGEST}"
            exit 1
          fi

          # Confirm the immutable digest is resolvable on GHCR
          docker buildx imagetools inspect "${FINAL_DIGEST}" >/dev/null

          {
            echo "final_digest=${FINAL_DIGEST}"
            echo "publish_mode=${PUBLISH_MODE}"
          } >> "$GITHUB_OUTPUT"

          echo "Final verified GHCR digest: ${FINAL_DIGEST}"
          {
            echo "## Published Render Runtime Image"
            echo ""
            echo "- **Immutable GHCR Digest Reference (use this in Render):** \`${FINAL_DIGEST}\`"
            echo "- **SHA Tag:** \`${IMAGE_TAG}\`"
            echo "- **Publish Mode:** ${PUBLISH_MODE}"
            echo "- **Source Commit SHA (\`main\`):** \`${VERIFIED_SHA}\`"
            echo "- **Verified \`main\` Push CI Run:** ${CI_RUN_URL}"
            echo "- **Verified \`main\` Dependency Audit Run:** ${AUDIT_RUN_URL}"
            echo "- **Platform:** \`linux/amd64\`"
            echo "- **Rollback Policy:** Previous \`sha-*\` tags and \`@sha256:...\` digests remain retained in GHCR."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Render promotion — only this job can read the render-production environment
  # secret. Automatic deployment runs only when the owner has set the
  # repository variable RABET_AUTO_DEPLOY_ENABLED=true. Manual release remains
  # publish-only by default; an owner can opt into deployment per dispatch.
  #
  # The helper updates the service's SAVED image reference to the immutable
  # digest and then deploys that same digest, so later dashboard "Deploy latest
  # reference" actions cannot silently redeploy an older tag. It verifies the
  # Render deploy reaches Live, its resolved image digest, and that
  # /api/healthz returns the exact full main SHA. A failed promotion restores
  # the previous saved image reference when it is still safe to do so.
  # ---------------------------------------------------------------------------
  deploy-render:
    name: Deploy verified digest to Render and verify live SHA
    needs: [prepare-release, publish]
    if: |
      needs.prepare-release.result == 'success' &&
      needs.publish.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RABET_AUTO_DEPLOY_ENABLED == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_render == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: render-image-deploy
      cancel-in-progress: false
    environment:
      name: render-production
    permissions:
      contents: read

    steps:
      - name: Checkout release gate helper at exact verified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.verified_sha }}
          fetch-depth: 1
          sparse-checkout: |
            scripts

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-verify target SHA is still current remote main
        env:
          VERIFIED_SHA: ${{ needs.prepare-release.outputs.verified_sha }}
        run: |
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ "${CHECKOUT_SHA}" != "${VERIFIED_SHA}" ]; then
            echo "::error::Checkout HEAD (${CHECKOUT_SHA}) !== verified SHA (${VERIFIED_SHA})."
            exit 1
          fi
          if [ "${REMOTE_MAIN_SHA}" != "${VERIFIED_SHA}" ]; then
            echo "::error::Stopping stale release before Render deploy: ${VERIFIED_SHA} is behind current origin/main (${REMOTE_MAIN_SHA})."
            exit 1
          fi
          echo "Confirmed ${VERIFIED_SHA} remains current origin/main before Render promotion."

      - name: Update Render saved image, deploy digest, verify Live and /api/healthz
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
          EXPECTED_SHA: ${{ needs.prepare-release.outputs.verified_sha }}
          IMAGE_REPO: ${{ needs.prepare-release.outputs.repo_path }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.final_digest }}
          RENDER_DEPLOY_TIMEOUT_MS: "1200000"
          RENDER_HEALTH_TIMEOUT_MS: "300000"
          RENDER_POLL_INTERVAL_MS: "10000"
        run: node scripts/render-deploy-gate.mjs deploy
